<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PfadiLager</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7f2;
      color: #1f2937;
    }

    header {
      background: #31572c;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #31572c;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .info {
      margin: 12px 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏕️ PfadiLager</h1>
    <p>Gemeinsam ins Abenteuer!</p>
  </header>

  <main>
    <div class="card">
      <h2>Sommerlager 2027</h2>

      <div class="info">📅 24. Juli – 31. Juli 2027</div>
      <div class="info">📍 Lagerplatz</div>
      <div class="info">👥 Für alle Pfadis</div>

      <button onclick="alert('Die Anmeldung kommt als Nächstes!')">
        📝 Jetzt anmelden
      </button>
    </div>
  </main>

</body>
</html>
